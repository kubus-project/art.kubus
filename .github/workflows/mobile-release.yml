name: Mobile release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag: { description: 'Existing v-prefixed release tag whose commit is on master', required: true, type: string }
      targets:
        description: 'Platforms to build and sign'
        required: true
        default: android
        type: choice
        options: [android, ios, both]
      publish_github_release: { description: 'Publish a new immutable GitHub Release for the tag (refused when one exists)', required: false, default: false, type: boolean }
      prerelease: { description: 'Mark as prerelease', required: false, default: true, type: boolean }
permissions:
  contents: read
concurrency:
  group: mobile-release-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false
env:
  FLUTTER_VERSION: '3.44.2'
  NODE_VERSION: '22.15.0'
  NPM_VERSION: '11.7.0'
jobs:
  source:
    name: Verify tag and production ancestry
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      tag: ${{ steps.source.outputs.tag }}
      publish: ${{ steps.source.outputs.publish }}
      prerelease: ${{ steps.source.outputs.prerelease }}
      build_android: ${{ steps.source.outputs.build_android }}
      build_ios: ${{ steps.source.outputs.build_ios }}
      ios_mode: ${{ steps.source.outputs.ios_mode }}
      version: ${{ steps.metadata.outputs.version }}
      build_number: ${{ steps.metadata.outputs.build_number }}
      build_date: ${{ steps.metadata.outputs.build_date }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with: { fetch-depth: 0, submodules: false }
      - id: source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
          EVENT_SHA: ${{ github.sha }}
          PUSH_TAG: ${{ github.ref_name }}
          MANUAL_TAG: ${{ inputs.release_tag }}
          MANUAL_TARGETS: ${{ inputs.targets }}
          MANUAL_PUBLISH: ${{ inputs.publish_github_release }}
          MANUAL_PRERELEASE: ${{ inputs.prerelease }}
          # Repository-level variable: a job-level `if` cannot read
          # environment-scoped variables, so it must not live in ios-release.
          IOS_RELEASE_ENABLED: ${{ vars.IOS_RELEASE_ENABLED }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }
          git fetch --no-tags origin master
          # Every release tag builds both platforms. iOS is signed when signing
          # is configured (IOS_RELEASE_ENABLED) and otherwise an explicitly
          # UNSIGNED IPA for re-signing; it is never skipped.
          ios_mode=unsigned; [ "$IOS_RELEASE_ENABLED" = true ] && ios_mode=signed
          if [ "$EVENT_NAME" = push ]; then
            tag="$PUSH_TAG"; publish=true; prerelease=false
            build_android=true; build_ios=true
          else
            # Manual runs rebuild an existing release tag. The signing
            # environments admit master only, so the workflow definition is
            # the reviewed one on master; the built source is the tag's commit.
            [ "$EVENT_REF" = refs/heads/master ] || fail "Run manual mobile releases from master (dispatched from $EVENT_REF)."
            tag="$MANUAL_TAG"; publish="$MANUAL_PUBLISH"; prerelease="$MANUAL_PRERELEASE"
            case "$MANUAL_TARGETS" in
              android) build_android=true; build_ios=false ;;
              ios) build_android=false; build_ios=true ;;
              both) build_android=true; build_ios=true ;;
              *) fail "Unknown targets value: $MANUAL_TARGETS" ;;
            esac
            [ "$publish" != true ] || [ "$MANUAL_TARGETS" = both ] || fail 'A GitHub Release is published only with targets=both, so a published release never lacks a platform.'
          fi
          [ "$build_ios" = true ] || ios_mode=none
          [[ "$tag" =~ ^v[0-9A-Za-z._-]+$ ]] || fail "Release tag must be v-prefixed: $tag"
          [[ "$tag" != *..* ]] || fail "Release tag must not contain '..': $tag"
          [[ "$publish" =~ ^(true|false)$ && "$prerelease" =~ ^(true|false)$ ]] || fail 'publish and prerelease must be booleans'
          git fetch --no-tags --force origin "refs/tags/$tag:refs/tags/$tag" || fail "Tag $tag does not exist on origin."
          sha="$(git rev-parse --verify "refs/tags/$tag^{commit}")"
          if [ "$EVENT_NAME" = push ]; then
            [ "$sha" = "$EVENT_SHA" ] || fail "Tag $tag moved during the run."
          fi
          git merge-base --is-ancestor "$sha" origin/master || fail "Tag $tag ($sha) is not contained by master."
          if [ "$publish" = true ] && gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            fail "A GitHub Release for $tag already exists; rebuild with publish_github_release=false to get workflow artifacts only."
          fi
          # Version metadata must come from the tagged source, not the dispatching branch.
          git checkout --quiet --detach "$sha"
          printf 'sha=%s\ntag=%s\npublish=%s\nprerelease=%s\nbuild_android=%s\nbuild_ios=%s\nios_mode=%s\n' "$sha" "$tag" "$publish" "$prerelease" "$build_android" "$build_ios" "$ios_mode" >> "$GITHUB_OUTPUT"
          echo "Mobile release source: $tag -> $sha (android=$build_android, ios=$build_ios/$ios_mode, publish=$publish)" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - id: metadata
        run: node scripts/resolve_ci_build_metadata.mjs --github-output "$GITHUB_OUTPUT"

  android:
    name: Sign Android APK and AAB
    needs: source
    if: ${{ needs.source.outputs.build_android == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    environment: android-release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          ref: ${{ needs.source.outputs.sha }}
          submodules: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - run: npm install --global "npm@${NPM_VERSION}"
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with: { distribution: temurin, java-version: '21', cache: gradle }
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with: { flutter-version: '3.44.2', channel: stable, cache: true }
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        # v4.0.1 defaults to installing the legacy `tools` package, which the
        # current cmdline-tools no longer lists; sdkmanager then fails before
        # anything compiles. platform-tools is the only package this step needs.
        with:
          packages: platform-tools
      - name: Configure protected Android signing
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS_SECRET: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD_SECRET: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD_SECRET: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for value in "$ANDROID_KEYSTORE_BASE64" "$ANDROID_KEY_ALIAS_SECRET" "$ANDROID_KEYSTORE_PASSWORD_SECRET" "$ANDROID_KEY_PASSWORD_SECRET"; do test -n "$value"; done
          key_path="$RUNNER_TEMP/art-kubus-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$key_path"
          chmod 600 "$key_path"
          printf 'ANDROID_KEYSTORE_PATH=%s\nANDROID_KEY_ALIAS=%s\nANDROID_KEYSTORE_PASSWORD=%s\nANDROID_KEY_PASSWORD=%s\nKUBUS_REQUIRE_RELEASE_SIGNING=true\n' "$key_path" "$ANDROID_KEY_ALIAS_SECRET" "$ANDROID_KEYSTORE_PASSWORD_SECRET" "$ANDROID_KEY_PASSWORD_SECRET" >> "$GITHUB_ENV"
      - run: flutter pub get
      - name: Prepare build configuration
        env:
          KUBUS_BACKEND_URL: ${{ vars.KUBUS_BACKEND_URL }}
          KUBUS_GOOGLE_CLIENT_ID: ${{ vars.KUBUS_GOOGLE_CLIENT_ID }}
          KUBUS_GOOGLE_WEB_CLIENT_ID: ${{ vars.KUBUS_GOOGLE_WEB_CLIENT_ID }}
          KUBUS_GOOGLE_IOS_CLIENT_ID: ${{ vars.KUBUS_GOOGLE_IOS_CLIENT_ID }}
          KUBUS_WALLETCONNECT_PROJECT_ID: ${{ vars.KUBUS_WALLETCONNECT_PROJECT_ID }}
          KUBUS_APP_VERSION: ${{ needs.source.outputs.version }}
          KUBUS_BUILD_NUMBER: ${{ needs.source.outputs.build_number }}
          KUBUS_BUILD_DATE: ${{ needs.source.outputs.build_date }}
          KUBUS_ANALYTICS_APP_ENABLED: ${{ vars.KUBUS_ANALYTICS_APP_ENABLED }}
          KUBUS_COMMUNITY_VIDEO_AUTOPLAY_ENABLED: ${{ vars.KUBUS_COMMUNITY_VIDEO_AUTOPLAY_ENABLED }}
          KUBUS_COMMUNITY_VIDEO_POSTERS_ENABLED: ${{ vars.KUBUS_COMMUNITY_VIDEO_POSTERS_ENABLED }}
          KUBUS_SUPPORT_TICKETS_ENABLED: ${{ vars.KUBUS_SUPPORT_TICKETS_ENABLED }}
        run: node scripts/prepare_public_build_config.mjs
      - name: Build signed packages
        run: |
          flutter build apk --release --build-name="${{ needs.source.outputs.version }}" --build-number="${{ needs.source.outputs.build_number }}" --dart-define-from-file=.dart_tool/public-build-defines.json
          flutter build appbundle --release --build-name="${{ needs.source.outputs.version }}" --build-number="${{ needs.source.outputs.build_number }}" --dart-define-from-file=.dart_tool/public-build-defines.json
      - name: Verify and package Android release
        shell: bash
        run: |
          set -euo pipefail
          apk="$(find build/app/outputs/flutter-apk -type f -name '*release*.apk' -print -quit)"
          aab="$(find build/app/outputs/bundle/release -type f -name '*.aab' -print -quit)"
          test -f "$apk"; test -f "$aab"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$apk"
          aab_verification="$(jarsigner -verify -certs "$aab")"
          printf '%s\n' "$aab_verification"
          grep -Fqx 'jar verified.' <<< "$aab_verification"
          mkdir -p release/android
          cp "$apk" "release/android/art.kubus-${{ needs.source.outputs.tag }}-${{ needs.source.outputs.sha }}.apk"
          cp "$aab" "release/android/art.kubus-${{ needs.source.outputs.tag }}-${{ needs.source.outputs.sha }}.aab"
          (cd release/android && sha256sum ./* > SHA256SUMS)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-release-${{ needs.source.outputs.sha }}
          path: release/android
          if-no-files-found: error
          retention-days: 30

  ios:
    name: Sign iOS IPA
    needs: source
    if: ${{ needs.source.outputs.ios_mode == 'signed' }}
    runs-on: macos-15
    timeout-minutes: 50
    environment: ios-release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          ref: ${{ needs.source.outputs.sha }}
          submodules: false
      # The signing tools come from this workflow's own revision so a manual
      # rebuild of an older tag still runs the reviewed signing checks.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          ref: ${{ github.sha }}
          path: .release-tools
          sparse-checkout: scripts/deploy
          submodules: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      # Signing is validated before the toolchain is installed so missing or
      # mismatched credentials fail in seconds rather than after a build.
      - name: Configure protected iOS signing
        env:
          IOS_DISTRIBUTION_CERTIFICATE_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
          IOS_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          IOS_TEAM_ID: ${{ vars.IOS_TEAM_ID }}
          IOS_BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID }}
          IOS_EXPORT_METHOD: ${{ vars.IOS_EXPORT_METHOD }}
        run: bash .release-tools/scripts/deploy/configure_ios_signing.sh
      - run: npm install --global "npm@${NPM_VERSION}"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with: { flutter-version: '3.44.2', channel: stable, cache: true }
      - run: flutter pub get
      - name: Select and record the iOS toolchain
        run: |
          set -euo pipefail
          # Apple requires the Xcode 26 SDK or later for App Store Connect uploads
          # (since 2026-04-28); the runner image default is older. Fail loudly rather
          # than build an IPA that cannot be uploaded.
          best="$(ls -d /Applications/Xcode_*.app | sed 's#.*/Xcode_##; s#\.app$##' | sort -V | awk -F. '$1 >= 26' | tail -n 1)"
          [ -n "$best" ] || { echo '::error::No Xcode 26 or later is installed on this runner image.'; exit 1; }
          sudo xcode-select -s "/Applications/Xcode_${best}.app"
          {
            echo '### iOS toolchain'
            xcodebuild -version
            echo "iphoneos SDK $(xcrun --sdk iphoneos --show-sdk-version)"
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Prepare build configuration
        env:
          KUBUS_BACKEND_URL: ${{ vars.KUBUS_BACKEND_URL }}
          KUBUS_GOOGLE_CLIENT_ID: ${{ vars.KUBUS_GOOGLE_CLIENT_ID }}
          KUBUS_GOOGLE_WEB_CLIENT_ID: ${{ vars.KUBUS_GOOGLE_WEB_CLIENT_ID }}
          KUBUS_GOOGLE_IOS_CLIENT_ID: ${{ vars.KUBUS_GOOGLE_IOS_CLIENT_ID }}
          KUBUS_WALLETCONNECT_PROJECT_ID: ${{ vars.KUBUS_WALLETCONNECT_PROJECT_ID }}
          KUBUS_APP_VERSION: ${{ needs.source.outputs.version }}
          KUBUS_BUILD_NUMBER: ${{ needs.source.outputs.build_number }}
          KUBUS_BUILD_DATE: ${{ needs.source.outputs.build_date }}
          KUBUS_ANALYTICS_APP_ENABLED: ${{ vars.KUBUS_ANALYTICS_APP_ENABLED }}
          KUBUS_COMMUNITY_VIDEO_AUTOPLAY_ENABLED: ${{ vars.KUBUS_COMMUNITY_VIDEO_AUTOPLAY_ENABLED }}
          KUBUS_COMMUNITY_VIDEO_POSTERS_ENABLED: ${{ vars.KUBUS_COMMUNITY_VIDEO_POSTERS_ENABLED }}
          KUBUS_SUPPORT_TICKETS_ENABLED: ${{ vars.KUBUS_SUPPORT_TICKETS_ENABLED }}
        run: node scripts/prepare_public_build_config.mjs
      - name: Build signed IPA
        run: flutter build ipa --release --build-name="${{ needs.source.outputs.version }}" --build-number="${{ needs.source.outputs.build_number }}" --export-options-plist="$IOS_EXPORT_OPTIONS" --dart-define-from-file=.dart_tool/public-build-defines.json
      - name: Verify and package IPA
        shell: bash
        env:
          EXPECTED_BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID }}
          EXPECTED_TEAM_ID: ${{ vars.IOS_TEAM_ID }}
          EXPECTED_VERSION: ${{ needs.source.outputs.version }}
          EXPECTED_BUILD_NUMBER: ${{ needs.source.outputs.build_number }}
          RELEASE_TAG: ${{ needs.source.outputs.tag }}
          SOURCE_SHA: ${{ needs.source.outputs.sha }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }
          plist() { /usr/libexec/PlistBuddy -c "Print :$1" "$2"; }
          ipa="$(find build/ios/ipa -type f -name '*.ipa' -print -quit)"
          [ -f "$ipa" ] || fail 'flutter build ipa produced no IPA'
          extraction="$RUNNER_TEMP/ipa"
          unzip -q "$ipa" -d "$extraction"
          app="$extraction/Payload/Runner.app"
          [ "$(plist CFBundleIdentifier "$app/Info.plist")" = "$EXPECTED_BUNDLE_ID" ] || fail 'IPA bundle identifier does not match IOS_BUNDLE_ID'
          [ "$(plist CFBundleShortVersionString "$app/Info.plist")" = "$EXPECTED_VERSION" ] || fail 'IPA version does not match the tagged source'
          [ "$(plist CFBundleVersion "$app/Info.plist")" = "$EXPECTED_BUILD_NUMBER" ] || fail 'IPA build number does not match the release metadata'
          codesign --verify --deep --strict --verbose=2 "$app"
          signature="$(codesign -dvv "$app" 2>&1)"
          grep -Fqx "TeamIdentifier=$EXPECTED_TEAM_ID" <<< "$signature" || fail 'IPA is signed by a different team'
          grep -E '^Authority=' <<< "$signature"
          embedded="$RUNNER_TEMP/embedded-profile.plist"
          security cms -D -i "$app/embedded.mobileprovision" > "$embedded"
          [ "$(plist UUID "$embedded")" = "$IOS_PROFILE_UUID" ] || fail 'IPA embeds a different provisioning profile'
          entitlements="$RUNNER_TEMP/signed-entitlements.plist"
          codesign -d --entitlements - --xml "$app" > "$entitlements" 2>/dev/null
          [ "$(plist application-identifier "$entitlements")" = "$EXPECTED_TEAM_ID.$EXPECTED_BUNDLE_ID" ] || fail 'signed application identifier does not match'
          case "$IOS_EXPORT_METHOD_RESOLVED" in
            development|debugging) ;;
            *) [ "$(plist get-task-allow "$entitlements" 2>/dev/null || echo false)" = false ] || fail 'distribution IPA allows debugging (get-task-allow)' ;;
          esac
          rm -f "$embedded" "$entitlements"
          mkdir -p release/ios
          base="art.kubus-$RELEASE_TAG-$SOURCE_SHA"
          cp "$ipa" "release/ios/$base.ipa"
          printf '{"tag":"%s","source_sha":"%s","version":"%s","build_number":"%s","bundle_id":"%s","team_id":"%s","export_method":"%s","signed":true,"run_id":"%s"}\n' \
            "$RELEASE_TAG" "$SOURCE_SHA" "$EXPECTED_VERSION" "$EXPECTED_BUILD_NUMBER" "$EXPECTED_BUNDLE_ID" "$EXPECTED_TEAM_ID" "$IOS_EXPORT_METHOD_RESOLVED" "$GITHUB_RUN_ID" > "release/ios/$base.ios-build.json"
          (cd release/ios && shasum -a 256 ./* > SHA256SUMS)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-release-${{ needs.source.outputs.sha }}
          path: release/ios
          if-no-files-found: error
          retention-days: 30
      - name: Remove ephemeral iOS signing material
        if: ${{ always() }}
        shell: bash
        run: |
          set +e
          [ -n "${IOS_SIGNING_KEYCHAIN:-}" ] && security delete-keychain "$IOS_SIGNING_KEYCHAIN" 2>/dev/null
          [ -n "${IOS_INSTALLED_PROFILE:-}" ] && rm -f "$IOS_INSTALLED_PROFILE"
          # Word splitting is intended: a space-separated list of RUNNER_TEMP paths.
          [ -n "${IOS_SIGNING_TEMP_FILES:-}" ] && rm -f $IOS_SIGNING_TEMP_FILES
          rm -f ios/Flutter/Release-CI.xcconfig
          rm -rf "$RUNNER_TEMP/ipa"
          exit 0

  # Runs when no Apple signing material is configured, so the release still
  # ships an iOS package: unsigned, labelled as such everywhere, and only
  # installable after the tester re-signs it. It holds no secrets and no
  # signing environment.
  ios-unsigned:
    name: Build unsigned iOS IPA
    needs: source
    if: ${{ needs.source.outputs.ios_mode == 'unsigned' }}
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          ref: ${{ needs.source.outputs.sha }}
          submodules: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - run: npm install --global "npm@${NPM_VERSION}"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with: { flutter-version: '3.44.2', channel: stable, cache: true }
      - run: flutter pub get
      - name: Select and record the iOS toolchain
        run: |
          set -euo pipefail
          # Apple requires the Xcode 26 SDK or later for App Store Connect uploads
          # (since 2026-04-28); the runner image default is older. Fail loudly rather
          # than build an IPA that cannot be uploaded.
          best="$(ls -d /Applications/Xcode_*.app | sed 's#.*/Xcode_##; s#\.app$##' | sort -V | awk -F. '$1 >= 26' | tail -n 1)"
          [ -n "$best" ] || { echo '::error::No Xcode 26 or later is installed on this runner image.'; exit 1; }
          sudo xcode-select -s "/Applications/Xcode_${best}.app"
          {
            echo '### iOS toolchain'
            xcodebuild -version
            echo "iphoneos SDK $(xcrun --sdk iphoneos --show-sdk-version)"
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Prepare build configuration
        env:
          KUBUS_BACKEND_URL: ${{ vars.KUBUS_BACKEND_URL }}
          KUBUS_GOOGLE_CLIENT_ID: ${{ vars.KUBUS_GOOGLE_CLIENT_ID }}
          KUBUS_GOOGLE_WEB_CLIENT_ID: ${{ vars.KUBUS_GOOGLE_WEB_CLIENT_ID }}
          KUBUS_GOOGLE_IOS_CLIENT_ID: ${{ vars.KUBUS_GOOGLE_IOS_CLIENT_ID }}
          KUBUS_WALLETCONNECT_PROJECT_ID: ${{ vars.KUBUS_WALLETCONNECT_PROJECT_ID }}
          KUBUS_APP_VERSION: ${{ needs.source.outputs.version }}
          KUBUS_BUILD_NUMBER: ${{ needs.source.outputs.build_number }}
          KUBUS_BUILD_DATE: ${{ needs.source.outputs.build_date }}
          KUBUS_ANALYTICS_APP_ENABLED: ${{ vars.KUBUS_ANALYTICS_APP_ENABLED }}
          KUBUS_COMMUNITY_VIDEO_AUTOPLAY_ENABLED: ${{ vars.KUBUS_COMMUNITY_VIDEO_AUTOPLAY_ENABLED }}
          KUBUS_COMMUNITY_VIDEO_POSTERS_ENABLED: ${{ vars.KUBUS_COMMUNITY_VIDEO_POSTERS_ENABLED }}
          KUBUS_SUPPORT_TICKETS_ENABLED: ${{ vars.KUBUS_SUPPORT_TICKETS_ENABLED }}
        run: node scripts/prepare_public_build_config.mjs
      - name: Build the archive without code signing
        run: flutter build ipa --release --no-codesign --build-name="${{ needs.source.outputs.version }}" --build-number="${{ needs.source.outputs.build_number }}" --dart-define-from-file=.dart_tool/public-build-defines.json
      - name: Package and verify the unsigned IPA
        shell: bash
        env:
          EXPECTED_BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID || 'com.art.kubus' }}
          EXPECTED_VERSION: ${{ needs.source.outputs.version }}
          EXPECTED_BUILD_NUMBER: ${{ needs.source.outputs.build_number }}
          RELEASE_TAG: ${{ needs.source.outputs.tag }}
          SOURCE_SHA: ${{ needs.source.outputs.sha }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }
          plist() { /usr/libexec/PlistBuddy -c "Print :$1" "$2"; }
          app="build/ios/archive/Runner.xcarchive/Products/Applications/Runner.app"
          [ -d "$app" ] || fail 'flutter build ipa --no-codesign produced no Runner.app'
          [ "$(plist CFBundleIdentifier "$app/Info.plist")" = "$EXPECTED_BUNDLE_ID" ] || fail 'bundle identifier does not match'
          [ "$(plist CFBundleShortVersionString "$app/Info.plist")" = "$EXPECTED_VERSION" ] || fail 'version does not match the tagged source'
          [ "$(plist CFBundleVersion "$app/Info.plist")" = "$EXPECTED_BUILD_NUMBER" ] || fail 'build number does not match the release metadata'
          [ ! -e "$app/embedded.mobileprovision" ] || fail 'an unsigned build must not embed a provisioning profile'
          staging="$RUNNER_TEMP/unsigned-ipa"
          mkdir -p "$staging/Payload" release/ios
          cp -R "$app" "$staging/Payload/"
          base="art.kubus-$RELEASE_TAG-$SOURCE_SHA-unsigned"
          (cd "$staging" && zip -qry "$GITHUB_WORKSPACE/release/ios/$base.ipa" Payload)
          printf '{"tag":"%s","source_sha":"%s","version":"%s","build_number":"%s","bundle_id":"%s","signed":false,"run_id":"%s"}\n' \
            "$RELEASE_TAG" "$SOURCE_SHA" "$EXPECTED_VERSION" "$EXPECTED_BUILD_NUMBER" "$EXPECTED_BUNDLE_ID" "$GITHUB_RUN_ID" > "release/ios/$base.ios-build.json"
          (cd release/ios && shasum -a 256 ./* > SHA256SUMS && cat SHA256SUMS)
          echo "### Unsigned iOS IPA: $RELEASE_TAG ($SOURCE_SHA)" >> "$GITHUB_STEP_SUMMARY"
          echo "No Apple signing is configured, so this IPA is unsigned and installs only after re-signing (Sideloadly, AltStore)." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-release-${{ needs.source.outputs.sha }}
          path: release/ios
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish immutable GitHub Release
    needs: [source, android, ios, ios-unsigned]
    # A release is complete only with Android AND iOS. Publishing waits for
    # every selected platform job and a skipped one never counts as success.
    if: >-
      ${{
        always() &&
        needs.source.result == 'success' &&
        needs.source.outputs.publish == 'true' &&
        needs.source.outputs.build_android == 'true' &&
        needs.source.outputs.build_ios == 'true' &&
        needs.android.result == 'success' &&
        (needs.ios.result == 'success' || needs.ios-unsigned.result == 'success')
      }}
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    env:
      RELEASE_TAG: ${{ needs.source.outputs.tag }}
      SOURCE_SHA: ${{ needs.source.outputs.sha }}
      IOS_MODE: ${{ needs.source.outputs.ios_mode }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          ref: ${{ github.sha }}
          sparse-checkout: scripts/deploy
          submodules: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: '*-release-${{ needs.source.outputs.sha }}'
          path: release
          merge-multiple: false
      - name: Verify checksums and assemble release files
        shell: bash
        run: |
          set -euo pipefail
          find release -name SHA256SUMS -print0 | while IFS= read -r -d '' manifest; do (cd "$(dirname "$manifest")" && sha256sum -c SHA256SUMS); done
          # One SHA256SUMS per release: the per-platform manifests share a
          # file name and would collide as release assets.
          mkdir -p dist
          while IFS= read -r -d '' file; do
            name="$(basename "$file")"
            [ ! -e "dist/$name" ] || { echo "::error::duplicate release file name $name"; exit 1; }
            cp "$file" "dist/$name"
          done < <(find release -type f ! -name SHA256SUMS -print0)
          # Refuses a missing platform, a stray file or a mismatched build
          # record, then records every hash and the iOS signing state.
          node scripts/deploy/release_manifest.mjs build --dir dist --tag "$RELEASE_TAG" --sha "$SOURCE_SHA" \
            --version "${{ needs.source.outputs.version }}" --build-number "${{ needs.source.outputs.build_number }}" \
            --ios-mode "$IOS_MODE" --notes-out "$RUNNER_TEMP/release-notes.md"
          (cd dist && sha256sum ./* > SHA256SUMS && cat SHA256SUMS)
          node scripts/deploy/release_manifest.mjs verify --dir dist --tag "$RELEASE_TAG" --sha "$SOURCE_SHA"
      # A release becomes public in one step, after every asset is proven.
      # Never reuse an existing release or leftover draft for this tag: the
      # asset set of a release is never edited, replaced or appended to.
      - id: precheck
        name: Refuse to reuse an existing release for the tag
        shell: bash
        run: |
          set -euo pipefail
          existing="$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate | jq -r --arg tag "$RELEASE_TAG" '.[] | select(.tag_name == $tag) | "\(.id) draft=\(.draft)"')"
          if [ -n "$existing" ]; then
            echo "::error::A release or draft for $RELEASE_TAG already exists ($existing). Inspect it and delete a stale draft yourself; this workflow never overwrites or completes one."
            exit 1
          fi
      # The release is created as a DRAFT and every upload error fails the
      # run. immutableCreate is deliberately not used: it would publish
      # inside the action, before this workflow has verified the uploaded
      # assets.
      - id: draft
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1
        with:
          tag: ${{ needs.source.outputs.tag }}
          commit: ${{ needs.source.outputs.sha }}
          name: art.kubus ${{ needs.source.outputs.tag }}
          prerelease: ${{ needs.source.outputs.prerelease }}
          draft: true
          bodyFile: ${{ runner.temp }}/release-notes.md
          generateReleaseNotes: true
          allowUpdates: false
          replacesArtifacts: false
          artifactErrorsFailBuild: true
          artifacts: dist/*
      - name: Verify the uploaded draft
        shell: bash
        env:
          RELEASE_ID: ${{ steps.draft.outputs.id }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }
          [ -n "$RELEASE_ID" ] || fail 'The release action reported no release id.'
          api="repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID"
          [ "$(gh api "$api" --jq .draft)" = true ] || fail 'The release is not a draft, so it cannot be verified before publication.'
          [ "$(gh api "$api" --jq '[.assets[] | select(.state != "uploaded")] | length')" = 0 ] || fail 'An asset is not fully uploaded.'
          [ "$(gh api "$api" --jq '.assets | length')" = "$(find dist -type f | wc -l)" ] || fail 'The draft does not carry exactly the assembled files.'
          mkdir draft-check
          gh api "$api" --jq '.assets[] | "\(.id) \(.name)"' | while read -r id name; do
            gh api -H 'Accept: application/octet-stream' "repos/$GITHUB_REPOSITORY/releases/assets/$id" > "draft-check/$name"
          done
          (cd draft-check && sha256sum -c SHA256SUMS)
          node scripts/deploy/release_manifest.mjs verify --dir draft-check --tag "$RELEASE_TAG" --sha "$SOURCE_SHA"
      - id: publish
        name: Publish the verified draft
        shell: bash
        env:
          RELEASE_ID: ${{ steps.draft.outputs.id }}
        run: |
          set -euo pipefail
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" -F draft=false > /dev/null
          echo 'published=true' >> "$GITHUB_OUTPUT"
      # Only this step may report the release complete: the assets as GitHub
      # now serves them publicly must match the manifest and checksums.
      - id: verify
        name: Verify the published release
        shell: bash
        run: |
          set -euo pipefail
          mkdir published
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir published
          (cd published && sha256sum -c SHA256SUMS)
          node scripts/deploy/release_manifest.mjs verify --dir published --tag "$RELEASE_TAG" --sha "$SOURCE_SHA"
          echo 'verified=true' >> "$GITHUB_OUTPUT"
          {
            echo "### Release $RELEASE_TAG published"
            echo "Android APK + AAB (signed) and iOS IPA ($IOS_MODE) verified against \`SHA256SUMS\` and \`release-manifest.json\`."
            [ "$IOS_MODE" = signed ] || echo "The iOS IPA is **unsigned**: it needs re-signing before it can be installed."
          } >> "$GITHUB_STEP_SUMMARY"
      # Any failure after the pre-check leaves nothing public: an unpublished
      # draft is deleted so a retry starts clean, and a release that went public
      # but failed verification is returned to draft. The pre-check proved no
      # release for this tag existed, and runs for one tag are serialised, so
      # any release found for the tag here was created by this run (the action
      # sets its id output only after uploading, so the lookup is by tag).
      - name: Withdraw an unverified release
        if: ${{ always() && steps.precheck.outcome == 'success' && steps.verify.outputs.verified != 'true' }}
        shell: bash
        run: |
          set +e
          gh api "repos/$GITHUB_REPOSITORY/releases" --paginate | jq -r --arg tag "$RELEASE_TAG" '.[] | select(.tag_name == $tag) | "\(.id) \(.draft)"' | while read -r id draft; do
            api="repos/$GITHUB_REPOSITORY/releases/$id"
            if [ "$draft" = true ]; then
              gh api -X DELETE "$api" && echo "::warning::Removed the unpublished draft release for $RELEASE_TAG; nothing was made public."
            elif gh api -X PATCH "$api" -F draft=true > /dev/null; then
              echo "::error::Release $RELEASE_TAG failed verification after publication and was returned to draft. It is NOT a complete release."
            else
              echo "::error::Release $RELEASE_TAG is public but FAILED verification and could not be returned to draft. Treat it as incomplete and fix it by hand."
            fi
          done
          exit 1
