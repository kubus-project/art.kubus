name: Temporary Dart format evidence (0.8.3)
on:
  push:
    branches: [fix/settings-support-center-20261008]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  format_evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.44.2'
          channel: stable
          cache: true
      - name: Format exactly four Dart files and emit reviewable patch
        shell: bash
        run: |
          set -euo pipefail
          dart format lib/screens/desktop/desktop_settings_screen_parts/desktop_settings_screen_p2.dart lib/screens/settings_screen_parts/settings_screen_p2.dart lib/screens/support_center_screen.dart lib/services/backend_api_service.dart
          git diff --binary -- lib/screens/desktop/desktop_settings_screen_parts/desktop_settings_screen_p2.dart lib/screens/settings_screen_parts/settings_screen_p2.dart lib/screens/support_center_screen.dart lib/services/backend_api_service.dart > "$RUNNER_TEMP/dart_format.patch"
          echo 'KUBUS_FORMAT_PATCH_BEGIN'
          base64 -w0 "$RUNNER_TEMP/dart_format.patch"
          echo
          echo 'KUBUS_FORMAT_PATCH_END'
